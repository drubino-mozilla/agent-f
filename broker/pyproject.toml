[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-f"
version = "0.4.0"
description = "Agent F broker: lets MCP clients work in the user's running Firefox"
license = "MPL-2.0"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.12,<2",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
test = ["pytest>=8", "anyio>=4"]

[tool.hatch.build.targets.wheel]
packages = ["agent_f"]

[tool.pytest.ini_options]
testpaths = ["tests"]
