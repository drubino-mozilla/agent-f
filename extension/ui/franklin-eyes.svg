<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1254 1254" width="1254" height="1254">
  <style>
    .look { animation: shifty 3.4s ease-in-out infinite; }
    @keyframes shifty {
      0%, 16% { transform: translateX(0); }
      26%, 50% { transform: translateX(60px); }
      60%, 68% { transform: translateX(0); }
      74%, 84% { transform: translateX(30px); }
      92%, 100% { transform: translateX(0); }
    }
    @media (prefers-reduced-motion: reduce) { .look { animation: none; } }
  </style>
  <defs>
    <clipPath id="left"><polygon points="424,560 470,572 518,586 607,611 606,622 600,637 587,653 553,669 520,670 487,660 462,644 445,628 432,610 425,590"/></clipPath>
