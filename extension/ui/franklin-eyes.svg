  </defs>
  <g clip-path="url(#left)">
    <g class="look">
      <circle cx="470" cy="594" r="46" fill="#1a0605"/>
      <circle cx="470" cy="596" r="39" fill="#5e1a13"/>
      <circle cx="476" cy="586" r="33" fill="#1a0605"/>
      <ellipse cx="451" cy="581" rx="11" ry="8" transform="rotate(-25 451 581)" fill="#fffaf5"/>
    </g>
    <polygon points="424,560 470,572 518,586 607,611 607,623 518,598 470,584 424,572" fill="rgb(90, 60, 50)" fill-opacity="0.16"/>
  </g>
